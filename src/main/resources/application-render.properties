# Activate alongside docker: SPRING_PROFILES_ACTIVE=docker,render
# Credentials are supplied by Render, never committed to the repository.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.default_schema=fleet_app
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
jwt.secret=${JWT_SECRET}
app.seed-demo-data=false
app.business-zone=Asia/Singapore
aws.s3.enabled=false

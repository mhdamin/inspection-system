# ========================================
# FleetGuard - Docker Compose Configuration
# ========================================
# This file orchestrates all services:
# - PostgreSQL (database)
# - Spring Boot Backend
# - React Frontend (Nginx)
#
# Usage:
#   Development: docker-compose up
#   Production:  docker-compose -f docker-compose.prod.yml up -d
# ========================================

version: '3.8'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: fleetguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetguard}
      POSTGRES_USER: ${POSTGRES_USER:-fleetguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
      # Initialization scripts
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fleetguard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetguard_user} -d ${POSTGRES_DB:-fleetguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================
  # Spring Boot Backend
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MAVEN_OPTS=-Xmx1024m
    image: fleetguard-backend:latest
    container_name: fleetguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}

      # Database configuration
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleetguard}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleetguard_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}

      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # AWS S3 configuration (optional)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-fleetguard-images}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}

      # JVM options for containerized environment
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Mount logs directory (optional)
      - ./logs:/app/logs
    networks:
      - fleetguard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.fleetguard.service=backend"
      - "com.fleetguard.version=1.0.0"

  # ========================================
  # React Frontend with Nginx
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fleetguard-frontend:latest
    container_name: fleetguard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # API URL is handled by nginx proxy
      # No need to set VITE_API_URL here
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - fleetguard-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.fleetguard.service=frontend"
      - "com.fleetguard.version=1.0.0"

# ========================================
# Networks
# ========================================
networks:
  fleetguard-network:
    driver: bridge
    name: fleetguard-network

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
    name: fleetguard-postgres-data
